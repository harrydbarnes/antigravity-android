name: Antigravity Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace --no-daemon > build.log 2>&1
          GRADLE_EXIT=$?
          echo "### Gradle Build Result (Exit Code: $GRADLE_EXIT)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          if [ $GRADLE_EXIT -ne 0 ]; then
            tail -n 120 build.log
            exit $GRADLE_EXIT
          fi

      - name: List outputs
        run: |
          find app/build/outputs -type f || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-mobile-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue --no-daemon
